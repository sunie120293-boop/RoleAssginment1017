<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 우리 반 1인 1역할 선호도 맞춤 배정판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --mint-bg: #edf7f5;
      --mint-card: #f5fbf9;
      --mint-border: #bfe5dc;
      --mint-primary: #38b29c;
      --mint-dark: #237a6b;
      --coral-primary: #ff6e6c;
      --coral-hover: #ff5250;
      --coral-soft: #ffeceb;
      --coral-border: #ffc2bf;
      --text-dark: #273733;
      --text-muted: #647d76;
      --shadow-sm: 0 4px 14px rgba(42, 138, 120, 0.08);
      --shadow-md: 0 10px 25px rgba(42, 138, 120, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--mint-bg);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text-dark);
      padding: 30px 15px 80px;
      min-height: 100vh;
      background-image: radial-gradient(#c6e8e0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      position: relative;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: 'Jua', sans-serif;
      font-size: 3.2rem;
      color: var(--mint-dark);
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0px #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    header p {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .step-card {
      background: #ffffff;
      border: 3px solid var(--mint-border);
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .step-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.85rem;
      color: var(--mint-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .sub-title-box {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--mint-dark);
      font-size: 1.15rem;
    }

    textarea {
      width: 100%;
      height: 240px;
      border: 2px dashed var(--mint-border);
      border-radius: 16px;
      padding: 16px;
      font-size: 1.15rem;
      font-family: inherit;
      line-height: 1.6;
      background: var(--mint-card);
      outline: none;
      resize: vertical;
      transition: all 0.2s;
      color: #1e2926;
    }

    textarea:focus {
      border-color: var(--mint-primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(56, 178, 156, 0.15);
    }

    .btn {
      font-family: 'Jua', sans-serif;
      border: none;
      cursor: pointer !important;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      position: relative;
      z-index: 20;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: scale(0.95) !important; }

    .btn-mint {
      background-color: var(--mint-primary);
      color: #fff;
      padding: 12px 22px;
      font-size: 1.15rem;
      box-shadow: 0 4px 10px rgba(56, 178, 156, 0.3);
    }

    .btn-coral-soft {
      background-color: var(--coral-soft);
      color: var(--coral-primary);
      border: 2px solid var(--coral-border);
      padding: 11px 18px;
      font-size: 1.05rem;
    }

    .btn-secondary {
      background-color: #f1f5f4;
      color: #4b635c;
      padding: 11px 18px;
      font-size: 1.05rem;
      border: 1.5px solid #d5e3e0;
    }

    .pref-table-wrapper {
      max-height: 520px;
      overflow-y: auto;
      border: 2px solid var(--mint-border);
      border-radius: 16px;
      background: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #e3f0ec;
    }

    th {
      background-color: #e2f4ef;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--mint-dark);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .student-badge {
      font-weight: 700;
      color: #1a2824;
      font-size: 1.25rem;
    }

    select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #cce5df;
      background: #ffffff;
      font-family: inherit;
      font-size: 1.05rem;
      color: #333;
      outline: none;
      cursor: pointer;
    }

    .pin-select {
      background-color: #fff6f5;
      border-color: var(--coral-border);
      color: #c92a2a;
      font-weight: 700;
    }

    .action-container {
      text-align: center;
      margin: 35px 0 25px;
    }

    .btn-assign-main {
      background-color: var(--coral-primary);
      color: #fff;
      font-size: 2.2rem;
      padding: 18px 56px;
      border-radius: 60px;
      box-shadow: 0 10px 25px rgba(255, 110, 108, 0.45);
    }

    .btn-assign-main:hover {
      background-color: var(--coral-hover);
      transform: translateY(-3px);
    }

    .results-area {
      display: none;
      background: #ffffff;
      border: 3px solid var(--mint-border);
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: var(--shadow-md);
      margin-top: 20px;
    }

    .stats-container {
      display: flex;
      gap: 14px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat-pill {
      flex: 1;
      min-width: 140px;
      padding: 14px 16px;
      border-radius: 18px;
      text-align: center;
      font-weight: 700;
      border: 2px solid transparent;
    }
    .stat-pill.fixed { background: #ffe8e7; border-color: #ffc2bf; color: #d63333; }
    .stat-pill.first { background: #fff9db; border-color: #ffe066; color: #b06200; }
    .stat-pill.second { background: #e7f5ff; border-color: #a5d8ff; color: #1864ab; }
    .stat-pill.third { background: #ebfbee; border-color: #b2f2bb; color: #2b8a3e; }
    .stat-pill.other { background: #f3f5f4; border-color: #dbe3e0; color: #526b64; }
    .stat-num { font-size: 1.6rem; font-weight: 900; margin-top: 4px; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .result-card {
      background: var(--mint-card);
      border: 2px solid var(--mint-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pref-badge {
      font-size: 0.95rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .badge-fixed { background: #ff6e6c; color: #ffffff; }
    .badge-1 { background: #ffe066; color: #7a4600; }
    .badge-2 { background: #74c0fc; color: #0c4a7e; }
    .badge-3 { background: #8ce99a; color: #1e5c29; }
    .badge-rand { background: #dee5e2; color: #445953; }

    .card-role {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--coral-primary);
      line-height: 1.35;
      word-break: keep-all;
      margin-top: 4px;
    }

    .card-student {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: 1px;
    }

    .shuffle-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(22, 45, 40, 0.75);
      backdrop-filter: blur(5px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }

    .slot-machine-box {
      background: #ffffff;
      border: 5px solid var(--coral-primary);
      border-radius: 35px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      max-width: 520px;
      width: 90%;
    }

    .slot-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      color: var(--coral-primary);
      margin-bottom: 20px;
    }

    .slot-window {
      background: #edf7f5;
      border: 3px solid var(--mint-border);
      border-radius: 20px;
      padding: 24px 15px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-text {
      font-family: 'Jua', sans-serif;
      font-size: 2.3rem;
      color: var(--mint-dark);
      letter-spacing: 1px;
    }

    .slot-sub {
      font-size: 1.15rem;
      font-weight: 700;
      color: #6a827b;
    }

    #confettiCanvas {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none !important;
      z-index: 99998;
    }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; }
      .container { max-width: 100% !important; }
      header, .step-card, .action-container, #confettiCanvas, .shuffle-overlay, .btn-print-box {
        display: none !important;
      }
      .results-area {
        display: block !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .results-header-title {
        text-align: center;
        font-family: 'Jua', sans-serif;
        font-size: 2.5rem;
        margin-bottom: 15px;
        color: #000;
      }
      .stats-container {
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .stat-pill {
        background: none !important;
        border: 1px solid #777 !important;
        color: #000 !important;
        padding: 6px 10px !important;
      }
      .results-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 12px !important;
      }
      .result-card {
        background: #ffffff !important;
        border: 1.5px solid #222 !important;
        border-radius: 12px !important;
        padding: 12px !important;
        page-break-inside: avoid;
      }
      .card-role { color: #000 !important; font-size: 1.25rem !important; }
      .card-student { color: #000 !important; font-size: 1.6rem !important; }
      .pref-badge { border: 1px solid #444; background: none !important; color: #000 !important; }
    }

    @media (max-width: 850px) {
      .input-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 2.2rem; }
      .btn-assign-main { font-size: 1.6rem; padding: 14px 34px; }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>

  <div class="shuffle-overlay" id="shuffleOverlay">
    <div class="slot-machine-box">
      <div class="slot-title">🎰 역할 룰렛 돌아가는 중!</div>
      <div class="slot-window">
        <div class="slot-text" id="slotRollText">두구두구두구... 🎲</div>
      </div>
      <div class="slot-sub">선호도를 분석하여 가장 공정하게 섞고 있습니다!</div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>🌿 우리 반 1인 1역할 선호도 맞춤 배정판</h1>
      <p>학생들의 선호도를 최대한 만족시키며, 사전 고정 역할과 공정 추첨을 지원합니
