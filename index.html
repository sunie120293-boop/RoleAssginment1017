<script>
'use strict';
(()=>{
 const officerNames={6:'임라온',23:'정의진',24:'최지훈'};
 const officerOrder=['정의진','최지훈','임라온'];
 const OFFICER_ROLE='officer';
 const FIXED_STUDENTS=["강다은", "김민서", "김혜린", "민미소", "손지연", "임라온", "전가은", "정서우", "정유주", "정하윤", "진서하", "자누리", "권기범", "김강민", "김성빈", "김지효", "남유혁", "백서진", "손성준", "송이수", "이시원", "전유진", "정의진", "최지훈"];
 const DEFAULT_ROLES=[
  {id:'officer',title:'학급 임원',emoji:'👑',cap:3,desc:'선생님과 친구들을 도와 학급에 봉사하기'},
  {id:'assistant',title:'선생님 비서',emoji:'💌',cap:2,desc:'학급 임원을 도와 선생님 심부름하기'},
  {id:'schedule',title:'시간표',emoji:'📋',cap:1,desc:'집 가기 전 시간표 바꾸기'},
  {id:'date',title:'날짜 바꿈이',emoji:'📅',cap:2,desc:'집 가기 전 내일 날짜와 요일로 바꾸기'},

  {id:'back',title:'뒷쓸이',emoji:'🧹',cap:2,desc:'교실 뒤 쓸기'},
  {id:'left',title:'왼쓸이',emoji:'🧹',cap:2,desc:'교실 왼쪽 쓸기'},
  {id:'right',title:'오쓸이',emoji:'🧹',cap:2,desc:'교실 오른쪽 쓸기'},
  {id:'desks',title:'책줄이',emoji:'🪑',cap:2,desc:'청소 끝나고 책상 줄 맞추기'},
  {id:'recycle',title:'분리배출',emoji:'♻️',cap:3,desc:'1층으로 분리배출하기'},
  {id:'window',title:'창문 열기',emoji:'🪟',cap:1,desc:'아침에 오면 환기 시키기 / 1교시 전 문 닫기'},

 ];
 const KEY='candy_roles_2person_fixed_roster_2026_v1';
 const $=id=>document.getElementById(id);

 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 // 우유 당번: 음료수 잔이 아닌 종이 우유곽 아이콘을 직접 그립니다.
 function roleIconMarkup(r){
  if(r?.id!=='milk')return esc(r?.emoji||'⭐');
  return `<svg class="milk-carton-svg" viewBox="0 0 64 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우유곽">
   <path d="M16 24 L28 8 H46 L57 24 V62 Q57 66 53 66 H18 Q14 66 14 62 V29 Q14 26 16 24Z" fill="#ebfbff" stroke="#2b83bd" stroke-width="3" stroke-linejoin="round"/>

   <path d="M46 8 V25 L57 24" fill="#b8e9ff" stroke="#2b83bd" stroke-width="2.5" stroke-linejoin="round"/>
   <path d="M16 25 H46 V64 H18 Q14 64 14 60 V29 Q14 26 16 25Z" fill="#fff" stroke="#2b83bd" stroke-width="2.2"/>
   <path d="M16 33 H46" stroke="#99d8ff" stroke-width="3"/>
   <path d="M30 38 C26 34 20 39 25 44 L31 50 L37 44 C42 39 35 34 31 38Z" fill="#ff78ad"/>
   <text x="31" y="59" font-family="sans-serif" font-weight="bold" text-anchor="middle" font-size="11" fill="#1978b0">우유</text>
  </svg>`;
 }

 const defaults=()=>({className:'2학년 6반',term:'2026학년도 2학기',students:FIXED_STUDENTS.map((name,i)=>({id:i+1,name,wish:[]})),roles:clone(DEFAULT_ROLES),assigned:{6:'officer',23:'officer',24:'officer'},updatedAt:null,autoFill:true,bestCandidates:[],previousBest:[],bestRanking:[],priorityChoices:{},flowStage:null});
 const safeStorage={read(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}},write(value){try{localStorage.setItem(KEY,JSON.stringify(value));return true}catch{return false}}};
 function normalize(raw){const d=defaults();if(!raw||typeof raw!=='object')return d;
  if(typeof raw.className==='string')d.className=raw.className.slice(0,70);
  if(typeof raw.term==='string')d.term=raw.term.slice(0,80);
  if(Array.isArray(raw.students)){raw.students.forEach((s,i)=>{const id=Number(s?.id??i+1);if(Number.isInteger(id)&&id>=1&&id<=24&&!officerNames[id]){d.students[id-1].wish=Array.isArray(s?.wish)?[...new Set(s.wish.filter(x=>typeof x==='string'))].slice(0,11):[];}})}
  // 학급 임원 역할 및 해당 학생 3명은 가져온 데이터로도 변경할 수 없습니다.
  d.roles[0]=clone(DEFAULT_ROLES[0]);d.students.forEach(s=>{if(officerNames[s.id]){s.wish=[]}else s.wish=s.wish.filter(id=>d.roles.some(r=>r.id===id&&id!=='officer'))});
  if(raw.assigned&&typeof raw.assigned==='object'){for(const s of d.students){if(!officerNames[s.id]){const id=raw.assigned[s.id];if(typeof id==='string'&&id!==OFFICER_ROLE&&d.roles.some(r=>r.id===id))d.assigned[s.id]=id;}}}
  for(const s of d.students.filter(s=>officerNames[s.id]))d.assigned[s.id]='officer';d.autoFill=raw.autoFill!==false;d.previousBest=Array.isArray(raw.previousBest)?[...new Set(raw.previousBest.map(Number).filter(id=>Number.isInteger(id)&&id>=1&&id<=24))].slice(0,3):[];
  const candidateIn=Array.isArray(raw.bestCandidates)?raw.bestCandidates: d.previousBest;
  d.bestCandidates=[...new Set(candidateIn.map(Number).filter(id=>Number.isInteger(id)&&id>=1&&id<=24))];
  if(!d.previousBest.every(id=>d.bestCandidates.includes(id))){d.previousBest=[]}
  const rankIn=Array.isArray(raw.bestRanking)?raw.bestRanking.map(Number):[];
  d.bestRanking=rankIn.length===3 && rankIn.every(id=>d.previousBest.includes(id)) && new Set(rankIn).size===3 ? rankIn : [];
  // 우선 선택은 최종 순위에 포함된 비임원만 가능하며, 일반 배정보다 정원에서 먼저 확보합니다.
  d.priorityChoices={};
  const sourceChoices=raw.priorityChoices && typeof raw.priorityChoices==='object' ? raw.priorityChoices : {};
  for(const id of d.bestRanking){
   if(officerNames[id])continue;
   const rid=sourceChoices[id];const selectedRole=d.roles.find(r=>r.id===rid&&r.id!=='officer');
   if(selectedRole && Object.values(d.priorityChoices).filter(x=>x===rid).length<selectedRole.cap)d.priorityChoices[id]=rid;
  }
   for(const id of Object.keys(d.priorityChoices))d.assigned[id]=d.priorityChoices[id];
   for(const id of d.previousBest){d.students[id-1].wish=[];if(!officerNames[id]&&!d.priorityChoices[id])delete d.assigned[id];}
  // 예전 버전에서 여러 역할을 신청했다면, 먼저 고른 역할 1개만 유지합니다.
  // 순서는 이전 브라우저 기록의 선택 순서입니다.
  d.students.forEach(s=>{if(s.wish.length>1)s.wish=s.wish.slice(0,1)});
  // 변경된 정원과 불일치하는 기록은 우선 선택자를 보호하고 정리합니다.
  for(const r of d.roles.slice(1)){
    const ids=Object.keys(d.assigned).filter(id=>d.assigned[id]===r.id);
    ids.sort((a,b)=>Number(!!d.priorityChoices[b])-Number(!!d.priorityChoices[a]));
    ids.slice(r.cap).forEach(id=>delete d.assigned[id]);
  }
  d.flowStage=['remaining','contests'].includes(raw.flowStage)?raw.flowStage:null;
  return d;
 }

 function save(){if(!safeStorage.write(data)){notify('브라우저 저장이 차단되어 있어요. 인쇄/PDF로 결과를 보관해 주세요.');}}
 function fixed(s){return !!officerNames[s.id]}
 function role(id){return data.roles.find(x=>x.id===id)}
 function knownStudents(){return data.students.filter(s=>s.name.trim()&&!fixed(s))}

 function assignedCount(id){return Object.values(data.assigned).filter(x=>x===id).length}
 function vacancies(id){return Math.max(0,(role(id)?.cap||0)-assignedCount(id))}
 function totalCapacity(){return data.roles.reduce((sum,r)=>sum+r.cap,0)}
 function roleText(id){return role(id)?.title||'미배정'}
 function render(){ $('classPill').textContent=`🏠 ${data.className||'우리 반'} · ${data.term||''} 🖍️`;

  const search=$('search');search.value=searchText;search.disabled=['survey','student-survey','tie','tie-intro','best','best-pick-game','best-pick','best-game','best-rank','best-results','best-role-pick','remaining'].includes(mode);
 }
 function renderIntro(){return `<div class="intro"><div class="intro-title">🎒<br>우리 반 친구들, 원하는 역할을 신청해 볼까요?</div><div class="intro-body">저번 달에 잘한 친구 3명은 <b>가위바위보 후 우선 역할 선택!</b><br>그 외 친구들은 <b>1·2·3순위 없이 원하는 역할 하나에 신청</b>할 수 있어요.<br>같은 역할에 신청자가 몰리면 <b>컴퓨터가 임의로 뽑지 않고 직접 가위바위보</b>를 합니다!</div><div class="lock-note">🔒 학급 임원 <strong>&nbsp;정의진 · 최지훈 · 임라온</strong>&nbsp; 3명은 고정이에요.</div>${data.previousBest.length===3?`<div class="rank-notice">🌟 우선 선택자 3명: ${esc(previousBestText())} · 이 친구들은 일반 역할 신청에서는 선택할 수 없어요.</div>`:''}${priorityMissing().length?`<div class="rank-notice">🏅 칭찬 친구의 우선 역할 선택이 아직 끝나지 않았어요! <button class="btn purple" data-action="best-role-pick">🍬 1·2·3순위 역할 선택 이어하기</button></div>`:priorityChosenCount()?`<div class="rank-notice">🎁 칭찬 친구 ${priorityChosenCount()}명의 역할을 먼저 확보했어요. <button class="btn purple" data-action="best-results">선택 결과 보기</button></div>`:''}</div>`}
 function filteredRoles(){
  const q=searchText.trim().toLowerCase();

  function roleApplicants(roleId){return generalStudents().filter(s=>s.wish.includes(roleId)).sort((a,b)=>a.id-b.id)}

   return `<section class="content"><div class="wish-hero"><h2 class="wish-page-title">📝 역할별 신청하기 (순위 없음)</h2><p>원하는 역할 카드의 <b>‘학생 선택’</b>을 눌러 신청하는 친구를 골라 주세요. 한 친구는 <b>한 역할에만 신청</b>할 수 있어요. 이미 다른 역할에 신청한 친구는 회색으로 표시되어 선택할 수 없습니다.</p><p>다음 단계를 누르면 경쟁 역할부터 가위바위보로 결정하고, 남은 친구들은 남은 역할을 직접 골라 배정합니다. 자동 추첨은 하지 않아요.</p><div class="fixed-banner">🔒 학급 임원 3명은 고정 · 번호/이름 수정 불가</div>${winners}</div>${roleWishCards(true)}<div class="actions"><button class="btn hot strong" data-action="assign">🎲 신청 완료 · 다음 단계로</button><button class="btn purple" data-action="wishlist">📋 신청 현황만 보기</button></div></section>`;
  }
  function renderStudentSurvey(){return renderSurvey()}
  function renderWishList(){return `<section class="content"><div class="wish-hero"><h2 class="wish-page-title">🍬 역할별 신청 현황 한눈에 보기</h2><p><b>역할이 중심!</b> 큰 역할 이름 아래 신청한 학생을 모두 보여줘요. 학생 한 명당 한 역할에만 신청할 수 있어요.</p><div class="fixed-banner">👑 학급 임원 고정 · <b>임라온 · 정의진 · 최지훈</b></div>${data.previousBest.length===3?`<div class="application-note">🌟 우선선택자 3명 · <b>${esc(previousBestText())}</b> (일반 신청 제외)</div>`:''}</div>${roleWishCards(false)}<div class="actions"><button class="btn hot" data-action="survey">✏️ 역할별 신청 수정</button><button class="btn yellow" data-action="assign">🎲 다음 단계 · 배정하기</button><button class="btn purple" data-action="cards">🍭 배정 학생 함께 보기</button></div></section>`}

 function cookieRecipients(){
  return ['recycle','milk'].map(id=>({role:role(id),people:data.students.filter(s=>data.assigned[s.id]===id).sort((a,b)=>a.id-b.id)}));
 }
 function cookieText(){
  const groups=cookieRecipients();
  return ['우리 반 역할 배정표 - 다했니 쿠키 지급 대상 (실제 지급 전 확인)', '번호\t이름\t담당 역할\t지급할 쿠키',
   ...groups.flatMap(g=>g.people.map(s=>`${s.id}\t${s.name}\t${g.role.title}\t5`)),
   '', '※ 다했니에서 쿠키를 직접 지급해야 하며, 이 명단 복사만으로는 지급되지 않습니다.'].join('\n');
 }
 function copyCookieRoster(){
  const txt=cookieText();
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>notify('5쿠키 지급 대상 명단을 복사했어요. 다했니에서 실제 지급해 주세요.')).catch(()=>fallbackCookieCopy(txt));}
  else fallbackCookieCopy(txt);
 }
 function fallbackCookieCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-10000px;top:0';document.body.appendChild(ta);ta.select();
  try{if(document.execCommand('copy'))notify('지급 대상 명단을 복사했어요.');else notify('복사에 실패했어요. CSV 저장을 이용해 주세요.')}catch{notify('복사에 실패했어요. CSV 저장을 이용해 주세요.')}finally{ta.remove()}
 }
 function exportCookieCSV(){
  const rows=[['번호','이름','담당 역할','지급할 쿠키'],...cookieRecipients().flatMap(g=>g.people.map(s=>[s.id,s.name,g.role.title,5]))];
  download('다했니_5쿠키_지급대상.csv','\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');

 }

    dialog(`${r.emoji} ${r.title} · 남은 친구 선택`, `<p>이 역할의 <b>남은 자리 ${vacancies(roleId)}명</b> 중 배정할 학생을 선택하세요. 한 학생은 한 역할만 맡습니다.</p><h3>💌 이 역할을 신청했던 친구 (${want.length}명)</h3><div class="wish-pick-grid">${want.length?cards(want):'<span class="quiet">신청한 미배정 친구가 없어요.</span>'}</div><h3>🍀 다른 미배정 친구 (${others.length}명)</h3><div class="wish-pick-grid">${others.length?cards(others):'<span class="quiet">다른 미배정 친구가 없어요.</span>'}</div><div class="wish-pick-help">가위바위보에서 이미 배정된 친구와 칭찬 친구 3명은 여기에 나타나지 않아요.</div>`,[
      {label:'✅ 선택한 친구 배정',style:'hot',action:()=>saveRemainingRole(roleId)},
      {label:'취소',style:'gray',action:()=>hideDialog()}
    ]);
  }
  function saveRemainingRole(roleId){
    const selected=[...document.querySelectorAll('#dialog .remaining-pick-input:checked')].map(el=>Number(el.value));
    if(!selected.length){notify('배정할 학생을 한 명 이상 선택해 주세요.');return}
    const slots=vacancies(roleId);
    if(selected.length>slots){notify(`${roleText(roleId)}의 남은 자리 ${slots}명만 선택할 수 있어요.`);return}
    const valid=new Set(remainingStudents().map(s=>s.id));
    if(new Set(selected).size!==selected.length||!selected.every(id=>valid.has(id))){notify('이미 배정된 학생이 포함되어 있어요. 다시 선택해 주세요.');return}
    selected.forEach(id=>{data.assigned[id]=roleId});
    data.flowStage='remaining';save();hideDialog();mode='remaining';render();
    notify(`${roleText(roleId)}에 ${selected.length}명을 배정했어요!`);
    if(!remainingStudents().length)notify('🎉 학생 24명 모두 배정 완료! 결과 보기를 눌러 주세요.');
  }
  function finishRemainingAssignment(){
    if(remainingStudents().length){notify(`아직 ${remainingStudents().length}명의 역할이 정해지지 않았어요.`);return}
    data.flowStage=null;data.updatedAt=new Date().toISOString();save();mode='results';render();window.scrollTo({top:240,behavior:'smooth'});notify('🎉 우리 반 역할 배정 완료!');
  }
 function changeManual(id,roleId){id=Number(id);const s=data.students[id-1];if(!s||fixed(s)||data.previousBest.includes(id))return;if(data.priorityChoices[id]){notify('이 친구는 우선 선택으로 확정했어요. 칭찬 친구 메뉴에서 다시 골라 주세요.');render();return}const old=data.assigned[id];if(roleId==='officer'){notify('학급 임원은 고정 3명뿐이에요.');render();return}delete data.assigned[id];if(roleId&&vacancies(roleId)<=0){if(old)data.assigned[id]=old;notify('이 역할은 정원이 가득 찼어요.');render();return}if(roleId)data.assigned[id]=roleId;save();render();notify('수동 배정을 저장했어요.')}
 const csvCell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 function download(filename,body,mime='text/plain;charset=utf-8'){const blob=new Blob([body],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
 function exportCSV(template=false){
    const rows=[['번호','이름','신청한 역할',...(!template?['배정 역할','고정 여부']:[])],...data.students.map(s=>[s.id,s.name,s.wish.map(roleText).join(' / '),...(!template?[roleText(data.assigned[s.id])==='미배정'?'':roleText(data.assigned[s.id]),fixed(s)?'임원 고정':data.previousBest.includes(s.id)?'칭찬 친구 우선선택':'']:[])])];
    download((template?'역할신청_양식':'우리반_역할배정_결과')+'.csv','\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('엑셀에서 열 수 있는 CSV 파일을 저장했어요.');
  }
 function backup(){download('우리반_역할배정_전체백업.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');notify('전체 데이터 JSON 백업을 저장했어요.')}
 function renderPrintArea(){
  // 인쇄 시에는 현재 배정 상태를 그대로 읽어 A4 세로형 2열 × 6행 게시용 역할 카드로 만듭니다.
  const sortedPeople=r=>data.students.filter(st=>data.assigned[st.id]===r.id)
    .sort((a,b)=>r.id==='officer'?officerOrder.indexOf(a.name)-officerOrder.indexOf(b.name):a.id-b.id);
  const cards=data.roles.map(r=>{
   const people=sortedPeople(r);
   const assigned=people.map(st=>`<span class="poster-person"><span class="num">${st.id}번</span><span class="name">${esc(st.name)}</span></span>`).join('');
   const empty=Array.from({length:Math.max(0,r.cap-people.length)},()=>'<span class="poster-person empty">이름 __________</span>').join('');
   return `<article class="poster-card"><div class="poster-role"><span class="poster-emoji">${roleIconMarkup(r)}</span><strong>${esc(r.title)}</strong><small>${r.cap}명${r.id==='officer'?' · 고정':''}</small></div><div class="poster-duty">${esc(r.desc)}</div><div class="poster-people">${assigned}${empty}</div></article>`;
  }).join('');
  const assignedCountNow=Object.keys(data.assigned).length;
  $('printArea').innerHTML=`<div class="poster-heading"><div class="kicker">🍭 OUR SWEET CLASSROOM 🍬</div><h2>우리 반 역할 배정표</h2><div class="subtitle">${esc(data.className)} · ${esc(data.term)} · 함께하는 우리 반의 약속</div></div><section class="poster-grid" aria-label="역할과 학생 이름 게시 카드">${cards}</section><div class="poster-footer"><span>🌈 작은 역할 하나하나가 모여 멋진 우리 반을 만들어요!</span><span class="count">배정 ${assignedCountNow} / 24명</span></div>`;
 }
 function printSheet(){
  // Direct click invokes the browser's real printer/PDF dialog without replacing the current screen.
  renderPrintArea();
  window.print();
 }
 function action(type,actionElement){if(type==='cookies'){mode='cookies';render()}else if(type==='cookie-copy'){copyCookieRoster()}else if(type==='cookie-csv'){exportCookieCSV()}else if(type==='cookie-open'){window.open('https://dahandin.com/page/students/69a620632e1d7fb530c58f8f','_blank','noopener,noreferrer')}else if(type==='results'){mode='results';render()}else if(type==='intro'){mode='intro';render()}else if(type==='survey'){mode='survey';render()}else if(type==='application-flow'){startApplicationFlow()}else if(type==='student-survey'){mode='student-survey';render()}else if(type==='edit-role-application'){editRoleApplication(actionElement?.dataset.role)}else if(type==='wishlist'){mode='wishes';render()}else if(type==='cards'){mode='cards';render()}else if(type==='table'){mode='table';render()}else if(type==='assign'){startAssignment()}else if(type==='resume-remaining'){mode='remaining';render()}else if(type==='reassign'){dialog('↩️ 다시 배정',`<p>기존 배정 결과를 지우고, 학급 임원 3명은 유지한 채 다시 배정할까요?</p>`,[{label:'다시 배정',style:'hot',action:()=>{hideDialog();startAssignment()}},{label:'취소',style:'gray',action:()=>hideDialog()}])}else if(type==='begin-tie'){if(tie){mode='tie';render();window.scrollTo({top:280,behavior:'smooth'})}}else if(type==='resolve-tie'){resolveTie()}else if(type==='pick-remaining-role'){pickRemainingRole(actionElement?.dataset.role)}else if(type==='finish-remaining'){finishRemainingAssignment()}else if(type==='cancel-assign'){dialog('배정 취소',`<p>가위바위보를 포함한 이번 배정 진행을 취소할까요? 임원 고정은 유지됩니다.</p>`,[{label:'배정 취소',style:'hot',action:()=>{clearAssignments();save();mode='intro';hideDialog();render()}},{label:'계속',style:'gray',action:()=>hideDialog()}])}else if(type==='best-results'){mode='best-results';render()}else if(type==='best-role-pick'){mode='best-role-pick';render()}else if(type==='choose-priority-role'){choosePriorityRole(actionElement?.dataset.id,actionElement?.dataset.role)}else if(type==='reset-priority'){resetPriority()}else if(type==='best'){selectedBest=[...data.bestCandidates];mode='best';render()}else if(type==='toggle-best'){toggleBest(actionElement?.dataset.id)}else if(type==='save-best'){saveBest()}else if(type==='best-pick-next'){selectedFinalists=selectedFinalists.filter(id=>data.bestCandidates.includes(id));mode='best-pick';render()}else if(type==='best-back-pick-game'){mode='best-pick-game';render()}else if(type==='toggle-finalist'){toggleFinalist(actionElement?.dataset.id)}else if(type==='save-finalists'){saveFinalists()}else if(type==='best-edit-finalists'){selectedFinalists=[...data.previousBest];mode='best-pick';render()}else if(type==='best-next'){if(data.previousBest.length===3){draftBestRanking=[...data.bestRanking];mode='best-rank';render();window.scrollTo({top:260,behavior:'smooth'})}}else if(type==='best-back-game'){mode='best-game';render();window.scrollTo({top:260,behavior:'smooth'})}else if(type==='best-rank-again'){draftBestRanking=[...data.bestRanking];mode='best-rank';render();window.scrollTo({top:260,behavior:'smooth'})}else if(type==='choose-best-rank'){chooseBestRank(actionElement?.dataset.id,actionElement?.dataset.rank)}else if(type==='save-best-rank'){saveBestRank()}else if(type==='save-survey'){doSurveySave()}else if(type==='export'||type==='export-template'){exportCSV(type==='export-template')}else if(type==='print'){printSheet()}}
 document.addEventListener('click',e=>{const d=e.target.closest('[data-dialog]');if(d){const buttons=$('overlay')._buttons||[];buttons[+d.dataset.dialog]?.action?.();return}const button=e.target.closest('[data-action]');if(button){e.preventDefault();action(button.dataset.action,button)}});
 $('search').addEventListener('input',e=>{searchText=e.target.value;const current=mode;if(current==='intro'){mode='cards'}if(['cards','table','wishes'].includes(mode)){render();$('search').focus();$('search').setSelectionRange(searchText.length,searchText.length)}else if(current==='results'){mode='cards';render()}});

 document.addEventListener('change',e=>{if(e.target.matches('.manual-assign'))changeManual(e.target.dataset.id,e.target.value)});
 $('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideDialog()});

 safeStorage.write(data);
 render();
